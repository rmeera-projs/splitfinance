name: CI

# Runs on every PR/push to main so broken tests are caught before merge, and
# on push (i.e. after a merge lands on main) also deploys to the AWS EC2
# instance - only if both test jobs passed first.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      # Needed even though every test mocks Prisma directly - some modules
      # import @prisma/client at load time, so the generated client has to
      # exist (same reason the server Dockerfile runs this before its build).
      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      # Before the tests, so a style/correctness slip fails fast rather than
      # after the whole suite has run. Both lint scripts use
      # --max-warnings 0, so warnings can't quietly accumulate either.
      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Run tests
        working-directory: server
        run: npm test

  # The real-database layer: same Express app, no Prisma mock, migrations
  # applied to a throwaway Postgres service container. Separate from the
  # unit job so a database problem is distinguishable at a glance from a
  # logic one, and so the fast suite still reports in seconds.
  integration:
    name: Backend integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: splitfinance_test
        ports:
          - 5432:5432
        # Without this the job can start running migrations before Postgres
        # is accepting connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/splitfinance_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Apply migrations
        working-directory: server
        run: npm run test:integration:setup

      - name: Run integration tests
        working-directory: server
        run: npm run test:integration

  frontend:
    name: Frontend lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Run tests
        working-directory: client
        run: npm test

      # Not deployed anywhere - just a smoke check that the production
      # build (what client/Dockerfile.prod and the AWS deploy both run)
      # actually compiles.
      - name: Build
        working-directory: client
        run: npm run build

  # The browser layer: brings up the full stack with Docker Compose exactly
  # as a developer would locally, then drives it with Playwright. Nothing is
  # mocked here at all.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Start the application stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -p splitfinance-e2e up -d --build

      - name: Wait for the stack to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5001/health > /dev/null && curl -sf http://localhost:5174 > /dev/null; then
              echo "stack is up"; exit 0
            fi
            sleep 2
          done
          echo "stack did not come up in time"; docker compose -p splitfinance-e2e logs; exit 1

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: e2e
        run: npm test

      # Traces/screenshots/video for whatever failed - the whole point of
      # capturing them is being able to see a CI-only failure afterwards.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Stack logs on failure
        if: failure()
        run: docker compose -p splitfinance-e2e logs --no-color

  # Decides whether a push can possibly affect the running application - a
  # README-only push used to redeploy and take the live site down for
  # nothing. Plain git/bash rather than a path-filter action, since this
  # workflow holds the AWS deploy permissions.
  changes:
    name: Does this touch the app?
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff is against wherever main pointed before this push,
          # which the default shallow clone will not contain.
          fetch-depth: 0

      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -u

          # Fail open: any unknown state (new branch, force push, missing
          # object) deploys. A skipped deploy that was actually needed is
          # worse than an unnecessary restart.
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]              || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Cannot work out what changed - deploying to be safe."
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! CHANGED=$(git diff --name-only "$BEFORE" "$AFTER"); then
            echo "git diff failed - deploying to be safe."
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          APP=false
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              # e2e/ and docs/ are never read by a container. .gitattributes
              # is deliberately excluded: it controls line endings at
              # checkout, and a CRLF shell script has broken the server
              # image before.
              *.md|.github/*|docs/*|e2e/*|.gitignore) ;;
              *) APP=true; break ;;
            esac
          done <<< "$CHANGED"

          echo "affects the running app: $APP"
          echo "app=$APP" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to AWS
    needs: [changes, backend, integration, frontend, e2e]
    # Deploys when a push to main actually touched the application, or on
    # demand from the Actions tab. That manual trigger is the escape hatch:
    # it is how you redeploy unchanged code, or recover if a skipped deploy
    # turns out to have been needed after all.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.changes.outputs.app == 'true'))
    runs-on: ubuntu-latest
    # id-token: write is what lets this job mint the OIDC token that
    # configure-aws-credentials exchanges for short-lived AWS credentials
    # below - the whole point of not using a long-lived access-key secret.
    permissions:
      id-token: write
      contents: read
    steps:
      # Exchanges this job's OIDC token for short-lived credentials scoped
      # to exactly ec2:DescribeInstances/ssm:SendCommand/
      # ssm:GetCommandInvocation (see terraform/github_oidc.tf) - no AWS
      # access-key secret stored in this repo at all, and the role can only
      # be assumed by this exact repo's own main-branch workflow runs.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::918441609401:role/splitfinance-github-actions-deploy
          aws-region: us-east-1

      # Runs the update via AWS Systems Manager rather than SSH - the
      # instance's security group intentionally only allows SSH from one
      # trusted IP (see terraform/variables.tf), which a GitHub-hosted
      # runner's dynamic IP will never match. SSM needs no inbound port at
      # all: it works over the instance's IAM role (terraform/main.tf's
      # aws_iam_instance_profile.ec2_ssm) and normal outbound internet
      # access, both already in place.
      - name: Deploy via AWS Systems Manager
        run: |
          set -e

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=splitfinance-app" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Could not find a running splitfinance-app instance."
            exit 1
          fi
          echo "Deploying to $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy from GitHub Actions (${{ github.sha }})" \
            --parameters 'commands=["cd /opt/splitfinance","git fetch origin","git reset --hard origin/main","docker compose up -d --build"]' \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
          if [ "$STATUS" != "Success" ]; then
            echo "Deploy command finished with status: $STATUS"
            exit 1
          fi
