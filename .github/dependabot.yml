# Keeps dependencies patched without anyone having to remember to run
# `npm audit`. Dependabot opens a PR per outdated/vulnerable package, and
# because PRs to main run the full CI workflow (lint, unit, integration,
# Playwright), each upgrade arrives already proven against the real test
# suite rather than needing a manual smoke test.
version: 2

updates:
  # Three separate npm projects, each with its own lockfile - Dependabot
  # needs one entry per directory or it only ever looks at the first.
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    groups:
      # Patch/minor bumps of dev tooling are noise one PR at a time, and
      # they're the bulk of the volume - batched into a single weekly PR
      # so the individually-reviewed ones stay visible.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, testing]

  # The workflow files pin actions by major version (actions/checkout@v4 and
  # friends), which stops getting security fixes the moment a new major
  # lands - this is the only thing that notices.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
