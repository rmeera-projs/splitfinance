version: "3.9"

# Docker's default json-file log driver has no size limit at all, so
# container output grows until it fills the disk. That was survivable when
# the server barely logged; it is not now that every security event is
# written as a line (server/src/services/securityLog.js). 50MB per service
# is plenty to investigate an incident from and far short of the instance
# volume.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    logging: *default-logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: splitfinance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    logging: *default-logging
    build: ./server
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/splitfinance?schema=public
      JWT_SECRET: change-this-to-a-long-random-string
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS:-}
    ports:
      - "5000:5000"

  client:
    logging: *default-logging
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:5173"

volumes:
  pgdata:
